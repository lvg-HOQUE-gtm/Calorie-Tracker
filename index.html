<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Sky Strike</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="game-wrap">
      <canvas id="game" width="480" height="720" aria-label="Sky Strike game"></canvas>

      <div id="hud" class="hidden">
        <span id="hud-score">Score 0</span>
        <span id="hud-wave">Wave 1</span>
        <span id="hud-lives">Lives 3</span>
      </div>

      <div id="overlay" class="overlay">
        <div class="panel">
          <h1 id="overlay-title">Sky Strike</h1>
          <p id="overlay-message">Defend the skies. Shoot incoming fighters before they reach you.</p>
          <p class="controls">
            Move: Arrow keys or WASD<br />
            Fire: Space (hold to auto-fire)
          </p>
          <button id="start-btn" type="button">Start</button>
        </div>
      </div>

      <div id="touch" class="touch hidden">
        <div id="stick" class="stick">
          <div id="stick-knob" class="stick-knob"></div>
        </div>
        <button id="fire-btn" type="button" aria-label="Fire">FIRE</button>
      </div>
    </div>

    <script src="js/entities.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
